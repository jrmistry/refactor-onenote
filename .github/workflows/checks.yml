name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[desktop,graph,dev]"
      - run: python -m pip check
      - run: python -m black --check onenote_hierarchy tests
      - run: python -m pylint onenote_hierarchy tests
      - run: python -m pytest -q

  desktop-only:
    name: Windows desktop without Graph
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install ".[desktop,dev]"
      - run: python -m pip check
      - name: Check optional dependency boundary
        run: |
          python -c "import importlib.util as u; assert u.find_spec('win32com'); assert all(u.find_spec(m) is None for m in ('requests', 'msal', 'msal_extensions'))"
          python -m onenote_hierarchy --help
          onenote-hierarchy --help
      - name: Controlled COM diagnostic fixtures
        run: python -m pytest --no-cov -q tests/test_desktop_diagnostics.py
